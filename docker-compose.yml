services:
  postgres:
    image: postgres:16-alpine
    container_name: srp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: srp
      POSTGRES_PASSWORD: srp
      POSTGRES_DB: srp
    ports:
      - "5432:5432"
    volumes:
      - srp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srp -d srp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  srp-postgres-data:
