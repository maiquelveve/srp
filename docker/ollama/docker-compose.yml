services:
  ollama:
    image: ollama/ollama:0.40.2
    container_name: srp-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - srp-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Roda uma vez, baixa os dois modelos para o volume e termina.
  ollama-pull:
    image: ollama/ollama:0.40.2
    container_name: srp-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3} &&
        ollama pull ${OLLAMA_CHAT_MODEL:-qwen2.5:7b-instruct}

volumes:
  srp-ollama-models:
